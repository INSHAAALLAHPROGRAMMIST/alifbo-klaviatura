name: build

# "Söz+" (toliq branch): tarjimon (Google Cloud Translation, to'g'ridan-to'g'ri) va parollar ombori bilan.
on:
  push:
    branches: [toliq]
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Imzo kaliti
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD_SECRET" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/alifbo.p12"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Doimiy imzo kaliti ishlatiladi."
          else
            PASS="$(openssl rand -hex 12)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -alias alifbo -keyalg RSA -keysize 2048 -validity 10000 \
              -storetype PKCS12 -keystore "$RUNNER_TEMP/alifbo.p12" \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Alifbo vaqtincha"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "::warning::Doimiy kalit yoq: vaqtinchalik imzo ishlatildi (har yig'ishda boshqa)."
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/alifbo.p12" >> "$GITHUB_ENV"

      - name: Standart tarjima kaliti
        env:
          GOOGLE_TRANSLATE_KEY: ${{ secrets.GOOGLE_TRANSLATE_KEY }}
        run: |
          if [ -n "$GOOGLE_TRANSLATE_KEY" ]; then
            echo "::add-mask::$GOOGLE_TRANSLATE_KEY"
            echo "GOOGLE_TRANSLATE_KEY=$GOOGLE_TRANSLATE_KEY" >> "$GITHUB_ENV"
            echo "Standart kalit qotiriladi."
          else
            echo "::warning::GOOGLE_TRANSLATE_KEY sir yo'q: APK'da standart kalit bo'lmaydi (foydalanuvchi o'zi kiritishi kerak)."
          fi

      - name: Sizib chiqishga qarshi (tarmoq kodi faqat Net.kt da)
        run: |
          PATTERN='java\.net\.|javax\.net\.|HttpURLConnection|HttpsURLConnection|okhttp|WebView|DatagramSocket'
          BAD="$(grep -rlE "$PATTERN" app/src/main/java | grep -v '/Net\.kt$' || true)"
          if [ -n "$BAD" ]; then
            echo "XATO: tarmoq API'si Net.kt dan tashqarida:"
            echo "$BAD"
            exit 1
          fi
          echo "Tarmoq kodi faqat Net.kt da."

      - name: Testlar (maketlar, alifbo, tarjima, parollar)
        run: gradle --no-daemon testDebugUnitTest

      - name: Dizayn rasmlari
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekranlar-toliq
          path: app/build/screens/
          if-no-files-found: warn

      - name: APK yig'ish
        run: gradle --no-daemon assembleRelease

      - name: Ruxsatlarni tekshirish (faqat INTERNET va USE_BIOMETRIC)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          echo "APK: $APK"
          "$BT/aapt2" dump permissions "$APK" | tee permissions.txt
          ALLOWED='^(android\.permission\.INTERNET|android\.permission\.USE_BIOMETRIC|uz\.alifbo\.klaviatura\.toliq\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)$'
          EXTRA="$(grep 'uses-permission' permissions.txt | sed -E "s/.*name='([^']+)'.*/\1/" | grep -vE "$ALLOWED" || true)"
          if [ -n "$EXTRA" ]; then
            echo "XATO: kutilmagan ruxsat:"
            echo "$EXTRA"
            exit 1
          fi
          echo "Ruxsatlar: faqat INTERNET (to'g'ridan-to'g'ri tarjima) va USE_BIOMETRIC (parollar)."

      - name: Imzo sertifikati
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "DN|SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: soz-toliq-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
